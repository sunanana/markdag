[package]
name = "markdag-wasm"
description = "The wasm boundary of markdag: plain extern \"C\" exports over linear memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
markdag-core = { path = "../markdag-core" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[features]
# 境界の試験だけで使う mdag_test_panic を出す。配布物のビルドでは有効にしない
test-panic = []
