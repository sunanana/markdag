kind: 正常
checks: >-
    凡例のパネル: 行を押すとそのグループを選び、行の操作ボタンを出す。色の四角でカラーピッカーを開き、色を選ぶと color を書き換える。名前のダブルクリックで行の中に名前の入力を開き、
    Enter で label を書き換える。目のボタンで枠の表示 (boundary) を切り替える。見出しを押すと開閉する。何も選んでいないときの「新規」はメンバーのいないグループを作り、名前の入力を開く (Esc で作る前に戻る)。
    ノードを選んで行にポインタを乗せると操作ボタンが出て、+ で選んだノードをそのグループに入れる。ノードを選んでいるときの「新規」は選んだノードを新しいグループにまとめる (⌘G と同じ)。
    ごみ箱でグループを解く
note: >-
    段 15 (凡例の行にポインタを乗せる) は CSS の :hover で操作ボタンを出すので、確認ページの合成の出来事では出ず、そこから先は通らない
    (examples-check の playwright のマウスとキーでは通る)。手で確かめるときは、行にマウスを乗せてから + を押す
behaviors: [B-148, B-149, B-158, B-159, B-160, B-161, B-162, B-163, B-164, B-165, B-166, B-167, B-168]
states: [C1.c8, D1.d1, D5.d2, D5.d5, D4.d5]
