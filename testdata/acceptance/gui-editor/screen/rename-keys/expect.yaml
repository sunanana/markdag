kind: 正常
checks: >-
    Enter で選んだノードの名前の入力を開く (帯、+、線を引く点は隠す)。入力中の Enter で名前を決めて兄弟を足し、その名前の入力へ移る (仮の名前を全部選ぶ)。
    足したばかりの名前の入力を Esc でやめると、足す前の原文と選択に戻る。⌘Z / Ctrl+Z で名前の変更も戻る
behaviors: [B-001, B-027, B-013, B-025, B-029, B-031, B-008, B-004, B-011, B-017, B-020, B-085]
states: [D1.d2, D3.d2, D2.d5, C2.c14, D3.v1, D3.v2, D3.v3, D2.v1, D2.v2, D2.v3]
decisions: [G-026 (入力中は帯を隠す), F-17 (入力中は線を引く点も隠す)]
steps:
    - click: { node: API }
      expect: { selection: nodes:API, bar: node }
    - key: Enter
      expect: { input: name, input_value: API, focus: 'name-input:node', bar: none, handles: [], hint: { contains: 決めて兄弟を足す } }
    - type: API 設計
    - key: Enter
      expect: { source: after-enter.md, input: name, input_value: 新しいノード, selection: nodes:新しいノード, bar: none }
    - key: Escape
      expect: { source: after-rename.md, input: none, selection: nodes:API 設計, bar: node }
    - key: ControlOrMeta+z
      expect: { source: input.md, selection: nodes:API }
