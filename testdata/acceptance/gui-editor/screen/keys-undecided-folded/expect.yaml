    この例を書いたときは、足すと作業の枝が開いた。閉じた枝は folded の欄 (図の開閉の状態) で照らす。
    2026-10-09 にタスク化の計画で書き直した (選んだノードが閉じた枝で見えなくなったら選択を解く。開いても解いたまま。docs/ignore/feature/task_ka/spec.md の「閉じた枝の中の選んだノード」、例の承認の関門 11/17 の d と 12/18 の a)。
    0.12.1 で承認した 1 段目 (閉じた枝の中の 2. 更新で Ctrl+Enter を押すと、枝を開いて下の兄弟 3. 再開へ移る) は起きなくなった。0.12.1 の期待と新しい期待は docs/ignore/feature/task_ka/records/deviations.md。
    開き直しても解いたままの段と、閉じ直す段を足した (あとの段は前と同じく作業を閉じたまま始める)
