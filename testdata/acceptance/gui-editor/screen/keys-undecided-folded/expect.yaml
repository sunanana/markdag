checks: >-
    図の開閉の印で枝 (作業) を閉じてから操作する。閉じる前に選んだノード (2. 更新) は、閉じた枝に隠れたので選択を解く。そこで Ctrl+Enter を押しても何もしない (枝は閉じたまま、選択も入力もない)。
    閉じた枝を開き直しても、選択は解いたまま。
    閉じた枝 (作業) へ兄弟から Ctrl+Enter で移ると、閉じたまま名前の入力を開く (決定 S-06 a)。
    閉じた枝があるときに別のノード (準備) の下へ兄弟を足しても、関係のない閉じた枝は閉じたまま。Esc で足す前に戻しても閉じたまま (決定 S-12 b)
note: >-
