kind: 境界 (決定 S-13 b)
os: mac
decided: [S-13]
checks: >-
    見出し (二つのリスト) の下に 2 つのリストがあると、リストごとに名前を持たない入れ物ができる。項目 (赤、1. 一号) で Shift+Tab を押すと、入れ物を飛ばして、その上の見出しの名前の入力を開く。
    名前の入力中なら、名前を決めてから見出しの名前の入力へ移る
note: >-
    決定 S-13 (2026-10-06、b: Shift+Tab で親へ移るとき、名前を持たないリストの入れ物は飛ばして、その上の見出しの名前の入力へ移る)
