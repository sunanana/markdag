checks: >-
    ノード 1 つ以外を選んでいるとき (ノード 2 つ以上、グループ、線、合流先を選ぶ途中) の Tab と Shift+Tab は、ブラウザの既定の動き (フォーカスの移動) を止めて何もしない (フォーカスは図のまま、選択も変えない)。
    何も選んでいないときの Tab はブラウザの既定のまま (GUI 編集はキーの既定の動きを止めない。フォーカスがどこへ移るかはブラウザ次第なので照らさない)
note: >-
