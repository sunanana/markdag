kind: 境界
checks: >-
    名前を「設計 #a」に変えると、末尾の #a がタグに化けないよう markdag が原文に \ を足す (- 設計 \#a)。
    名前の入力を開き直すと、入力欄にはその \ を出さず、図の名前と同じ「設計 #a」を出す。
    その値のまま Enter で決めても名前の行は変わらない (二重に逃がさない。Enter なので兄弟は足し、Esc で足す前に戻る)
behaviors: [B-027, B-029, B-031, B-034]
states: [D1.d2, D3.d2, D2.d5]
decisions: ['整える 名前の入力の \ (名前の入力を開き直したとき、markdag が足した \ を入力欄に出さない)']
steps:
    - click: { node: フロント }
      expect: { selection: nodes:フロント, bar: node }
    - key: Enter
      expect: { input: name, input_value: フロント, focus: 'name-input:node' }
    - type: '設計 #a'
    - key: Enter
      expect: { source: after-enter.md, input: name, input_value: 新しいノード, selection: nodes:新しいノード }
    - key: Escape
      expect: { source: after-rename.md, input: none, selection: 'nodes:設計 #a', bar: node }
    - key: Enter
      expect: { input: name, input_value: '設計 #a', focus: 'name-input:node', source: after-rename.md }
    - key: Enter
      expect: { source: after-enter.md, input: name, input_value: 新しいノード, selection: nodes:新しいノード }
    - key: Escape
      expect: { source: after-rename.md, input: none, selection: 'nodes:設計 #a', bar: node }
