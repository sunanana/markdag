kind: 境界
checks: >-
    グループを選んでいて、そのグループのノードが全部閉じた枝に隠れたら、グループの選択を解く (コンテキストメニューも消える)。
    グループのノードが一部だけ隠れたとき (枝そのもののノードは見えている) は選んだまま。
    線を選んでいて、線の片方の端のノード (終点でも始点でも) が閉じた枝に隠れたら、線の選択を解く (線の強調も消える)。
    どれも、もう一度開いて見えても、選択は解いたまま (ノードと同じ扱い)。解いたあとの X は、何も選んでいないときと同じく書き換えずに選び方を案内する
