kind: 正常
checks: >-
    Tab で選んだノードに子を足し、名前の入力へ移る。入力中の Shift+Tab は名前を決めて兄弟を、Tab は決めて子を足す。
    足したばかりの入力の Esc はその足す前に戻る。何もないところを押すと入力のないまま選択を解く
behaviors: [B-026, B-030, B-031, B-021, B-025]
states: [D1.d4, D2.d4, D2.d5, C2.c9]
steps:
    - click: { node: フロント }
    - key: Tab
      expect: { source: after-tab.md, input: name, input_value: 新しいノード, selection: nodes:新しいノード }
    - type: 部品
    - key: Shift+Tab
      expect: { source: after-shift-tab.md, input: name, input_value: 新しいノード }
    - type: ボタン
    - key: Tab
      expect: { source: after-tab2.md, input: name, selection: nodes:新しいノード }
    - key: Escape
      expect: { source: after-escape.md, input: none, selection: nodes:ボタン }
    - click: { blank: true }
      expect: { input: none, selection: none, source: after-escape.md }
