          key_prevented: true
    - click: { fold: 準備 }
      expect: { folded: [], selection: none, bar: none }
    - click: { node: 見積もりを取る }
      expect: { selection: nodes:見積もりを取る }
    - click: { fold: 引っ越し }
      expect: { folded: [引っ越し], selection: none, bar: none }
    - click: { fold: 引っ越し }
      expect: { folded: [], selection: none, bar: none }
    - click: { node: 見積もりを取る }
