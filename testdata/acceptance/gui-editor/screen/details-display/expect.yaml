kind: 正常
decided: [U-10]
checks: >-
    道具箱の「詳細表示」にポインタを乗せると選択肢を出し、選んだ見せ方 (常に表示) で図の詳細の見せ方を変える (原文は変えない)。ノードの中に開いた詳細のダブルクリックで詳細の入力を開く。
    選択肢を開いている間の Enter は、図にフォーカスがあれば名前の入力を開き、選択肢は開いたまま (U-10 で決まった)。
    閲覧では文書の指定 (click) に戻し、GUI 編集に戻ると選んだ見せ方に戻す
behaviors: [B-126, B-127, B-128, B-049, B-170]
