kind: 正常
checks: >-
    buildStandaloneHtml で作った単体 HTML を開くと、入れ子の枠 (fe が dev の中) が library と同じメンバーで描かれ、入り込みもラベルの重なりもない
combos: [1-7]
decisions: [B-9]
call:
    api: >-
        buildStandaloneHtml({ source: input.md }) を開く。開いたページを 1800x1100 で測る (getBoundingClientRect。screen と同じ測り方)。diagnostics と folded は window.markdagStandalone から読む
expect:
    diagnostics: []
    folded: []
    frames:
        - { group: dev, members: [開発, 画面, 一覧, 詳細, API, 認証, 検索], inside: [] }
        - { group: fe, members: [画面, 一覧, 詳細], inside: [dev] }
    overlap: { disjoint: 0, crossing: 0 }
    intrusions: 0
    labels: { count: 2, on_node: [], crosses_frame: [], on_label: [], wider_than_frame: [] }
