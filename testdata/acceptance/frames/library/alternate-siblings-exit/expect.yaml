kind: 正常
checks: >-
    同じグループの見出しの間にメンバーでない見出し (調整) が挟まると、枠は 2 つに分かれ、調整はどちらの枠にも入らない。
    前の枠のメンバーから告知への relations では、告知は両方の枠の右
combos: [3-5]
decisions: [Q2-c, B-9]
call:
    api: >-
        render(element, input.md, { animate: false, onLayout }) を 1800x1100 の要素に描き、rect.mdag-frame (図の座標) と
        onLayout の rects と buildModel の groupsOf から測る
expect:
    diagnostics: []
    frames:
        - { group: a, members: [設計, 画面, API], inside: [] }
        - { group: a, members: [実装, フロント, バック], inside: [] }
    unframed: {}
    overlap: { disjoint: 0, crossing: 0 }
    intrusions: 0
    sides:
        調整: { "a[設計]": 下, "a[実装]": 上 }
        告知: { "a[設計]": 右, "a[実装]": 右 }
