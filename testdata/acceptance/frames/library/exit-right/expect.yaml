kind: 正常
checks: >-
    枠のメンバー (設計/画面) から最上位のメンバーでないノード (告知) への relations。告知は枠の右の外に置かれ、枠に入らない
combos: [3-1]
decisions: [Q2-c, B-9]
call:
    api: >-
        render(element, input.md, { animate: false, onLayout }) を 1800x1100 の要素に描き、rect.mdag-frame (図の座標) と
        onLayout の rects と buildModel の groupsOf から測る
expect:
    diagnostics: []
    frames:
        - { group: a, members: [設計, 画面, API], inside: [] }
    unframed: {}
    overlap: { disjoint: 0, crossing: 0 }
    intrusions: 0
    sides:
        告知: { a: 右 }
    clearance:
        告知: { a: { right_min: 80 } }
