kind: 境界
status: 未決
checks: >-
    一部共有する p と q の、共有する試作を文書で閉じる。p {要件, 試作} と q {試作, 実装} が試作の所で交差して重なり、入り込みはない
combos: [2-5]
decisions: [B-9, Q4-b]
call:
    api: >-
        render(element, input.md, { animate: false, onLayout }) を 1800x1100 の要素に描き、rect.mdag-frame (図の座標) と
        onLayout の rects と buildModel の groupsOf から測る
expect:
    diagnostics: []
    visible: 4
    frames:
        - { group: p, members: [要件, 試作], inside: [] }
        - { group: q, members: [試作, 実装], inside: [] }
    unframed: {}
    overlap: { disjoint: 0, crossing: 1 }
    intrusions: 0
    sides:
        要件: { q: 上 }
        実装: { p: 下 }
    edges:
        - { frame: q, against: p, left: 4, right_min: 16 }
