kind: 境界
checks: >-
    内側の枠の根 (画面) を文書で閉じると、fe は見えるメンバー 1 つ (画面) の枠になり、外側の dev の枠の中に入る。
    画面の下の API は fe の枠の下
combos: [2-4]
decisions: [gui-editor の F-02 (メンバーが 1 つの所も枠。scope.md の「触る F-02」、records/deviations.md の D-013)]
call:
    api: >-
        render(element, input.md, { animate: false, onLayout }) を 1800x1100 の要素に描き、rect.mdag-frame (図の座標) と
        onLayout の rects と buildModel の groupsOf から測る
expect:
    diagnostics: []
    visible: 7
    frames:
        - { group: dev, members: [開発, 画面, API, 認証, 検索], inside: [] }
        - { group: fe, members: [画面], inside: [dev] }
    unframed: {}
    overlap: { disjoint: 0, crossing: 0 }
    intrusions: 0
    sides:
        公開: { dev: 下 }
        API: { fe: 下 }
