kind: 正常
checks: >-
    メンバーが同じ 2 つのグループ (%a %b を同じ見出しに付ける) は、枠が 2 つの入れ子になる。groups に先に書いた a が外側
combos: [1-13]
decisions: [B-9]
call:
    api: >-
        render(element, input.md, { animate: false, onLayout }) を 1800x1100 の要素に描き、rect.mdag-frame (図の座標) と
        onLayout の rects と buildModel の groupsOf から測る
expect:
    diagnostics: []
    frames:
        - { group: a, members: [設計, 画面, API], inside: [] }
        - { group: b, members: [設計, 画面, API], inside: [a] }
    unframed: {}
    overlap: { disjoint: 0, crossing: 0 }
    intrusions: 0
    sides:
        実装: { a: 下, b: 下 }
