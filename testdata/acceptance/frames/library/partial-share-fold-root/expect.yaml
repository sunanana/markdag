kind: 境界
status: 未決
checks: >-
    一部共有する p と q の、p だけの根 (要件) を文書で閉じる。要件の子 2 つが隠れ、見える並びは partial-share-heading と同じで、
    2 つの枠が試作の所で交差して重なる
combos: [2-6]
decisions: [B-9, Q4-b]
call:
    api: >-
        render(element, input.md, { animate: false, onLayout }) を 1800x1100 の要素に描き、rect.mdag-frame (図の座標) と
        onLayout の rects と buildModel の groupsOf から測る
expect:
    diagnostics: []
    visible: 7
    frames:
        - { group: p, members: [要件, 試作, 画面, API, 計測], inside: [] }
        - { group: q, members: [試作, 画面, API, 計測, 実装], inside: [] }
    unframed: {}
    overlap: { disjoint: 0, crossing: 1 }
    intrusions: 0
    sides:
        要件: { q: 上 }
        実装: { p: 下 }
    edges:
        - { frame: q, against: p, left: 4, right_min: 16 }
