kind: 境界
checks: >-
    H1〜H6 の見出しで作る 5 段の入れ子の枠。いちばん外の枠 (l1) は内側に 4 段を持つので、枠の余白 (side) が
    横の間隔 (spacing_horizontal) より大きい。内側の枠はすべて外側の枠の中に収まり、入り込みはなく、
    ルートのノードはいちばん外の枠の左の辺に食い込まない (枠の左)
combos: []
decisions: [B-9]
call:
