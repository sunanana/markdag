        render(element, input.md, { animate: false, onLayout }) を 1800x1100 の要素に描き、rect.mdag-frame (図の座標) と
        onLayout の rects と buildModel の groupsOf から測る
expect:
    diagnostics: []
    frames:
        - { group: l1, members: [本部, 事業, 開発, 画面, 一覧, 作業], inside: [] }
        - { group: l2, members: [事業, 開発, 画面, 一覧, 作業], inside: [l1] }
        - { group: l3, members: [開発, 画面, 一覧, 作業], inside: [l1, l2] }
        - { group: l4, members: [画面, 一覧, 作業], inside: [l1, l2, l3] }
        - { group: l5, members: [一覧, 作業], inside: [l1, l2, l3, l4] }
    intrusions: 0
    sides:
        深い入れ子、5 段: { l1: 左 }
