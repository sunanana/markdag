kind: 境界
checks: >-
    枝をまたぐグループの片方の枝 (実装) を文書で閉じると、見える枝の枠 1 つだけになる。設計/画面からの relations の先の告知は枠の右
combos: [4-3]
decisions: [Q2-c]
call:
    api: >-
        render(element, input.md, { animate: false, onLayout }) を 1800x1100 の要素に描き、rect.mdag-frame (図の座標) と
        onLayout の rects と buildModel の groupsOf から測る
expect:
    diagnostics: []
    visible: 6
    frames:
        - { group: a, members: [画面, API], inside: [] }
    unframed: {}
    overlap: { disjoint: 0, crossing: 0 }
    intrusions: 0
    sides:
        告知: { a: 右 }
