kind: 境界
checks: >-
    枠の根 (設計) の開閉の円をクリックして閉じると a は見えているメンバー 1 つ (設計) の枠になり (ラベルも 1 つずつ)、b の枠は残る。
    もう一度クリックして開くと a の枠が初めのメンバーに戻り、初めと同じ並び
combos: [2-2]
decisions: [gui-editor の F-02 (メンバーが 1 つの所も枠。scope.md の「触る F-02」、records/deviations.md の D-014)]
render:
    api: >-
        render(element, input.md, { animate: false }) を 1800x1100 の要素に描き、getBoundingClientRect (画面の px) で
        rect.mdag-frame、text.mdag-frame-label の文字のインク、.mdag-node の .mdag-box を測る
steps:
    - measure: 初め
    - click_fold: 設計
    - measure: 閉じたあと
    - click_fold: 設計
    - measure: 開き直したあと
expect:
    diagnostics: []
    初め:
        visible: 7
        frames:
            - { group: a, members: [設計, 画面, API], inside: [] }
            - { group: b, members: [実装, フロント, バック], inside: [] }
        overlap: { disjoint: 0, crossing: 0 }
        intrusions: 0
        labels: { count: 2, on_node: [], crosses_frame: [], on_label: [], wider_than_frame: [] }
    閉じたあと:
        visible: 5
        frames:
            - { group: a, members: [設計], inside: [] }
            - { group: b, members: [実装, フロント, バック], inside: [] }
        unframed: {}
        overlap: { disjoint: 0, crossing: 0 }
        intrusions: 0
        labels: { count: 2, on_node: [] }
    開き直したあと:
        visible: 7
        frames:
            - { group: a, members: [設計, 画面, API], inside: [] }
            - { group: b, members: [実装, フロント, バック], inside: [] }
        overlap: { disjoint: 0, crossing: 0 }
        intrusions: 0
        labels: { count: 2, on_node: [] }
