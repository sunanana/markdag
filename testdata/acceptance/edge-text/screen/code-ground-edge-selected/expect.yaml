kind: 正常
checks: >-
    ノードの code (pre の中の code も) の地は、ふだん 90% に透かし (地の不透明さ 0.9)、線を選んでいる間 (図の要素に data-edge-selected が付く間) は 30% に透かす。
    線を選ぶと、線の両端のノード (作業中と薄く表示) も、強調から外れたノード (薄く表示のものも) も、code の地は 30% になる。
    薄く表示の地 (背景の色と混ぜた色) も同じ割合で透かし、強調から外れた薄く表示のノードは色を混ぜずに元の地の色を 30% にする。
    mark の地は透かさない (1 のまま)。同じ線をもう一度クリックして選びを解くと 90% に戻る
combos: [B code 薄く表示, B pre 薄く表示, A 強調から外れた ダーク, A 強調から外れた + 薄く表示 ダーク, A 強調した + 薄く表示 ダーク]
decisions: [Q6, Q12]
render:
    api: >-
        render(element, input.md, { theme: 'dark', animate: false }) で描き、線の当たりの帯 (path.mdag-edge-hit) をクリックして選び、同じ線をもう一度クリックして選びを解く。
        図の要素 (.markdag) の data 属性と、ノードの要素と部品の getComputedStyle を読む。地は reference のノードの同じ部品と比べ (同じ / 違う)、地の不透明さは地の色の α を値で見る
    theme: dark
reference: 作業中の
steps:
    - measure: 初め
    - click_edge: 完了の --> 受け取る
    - measure: 線を選んだ
    - click_edge: 完了の --> 受け取る
    - measure: 選びを解いた
expect:
    diagnostics: []
    初め:
        図: { 線を選んでいる: false }
        作業中の:
            ノード: { opacity: 1, 薄く表示: false, 強調から外れた: false }
            code: { 地の不透明さ: 0.9 }
            pre の中の code: { 地の不透明さ: 0.9 }
            mark: { 地の不透明さ: 1 }
        完了の:
            ノード: { opacity: 1, 薄く表示: true, 強調から外れた: false }
            code: { 地: 違う, 地の不透明さ: 0.9 }
            pre の中の code: { 地: 違う, 地の不透明さ: 0.9 }
            mark: { 地の不透明さ: 1 }
        外れて完了の:
            code: { 地: 違う, 地の不透明さ: 0.9 }
        受け取る:
            code: { 地: 同じ, 地の不透明さ: 0.9 }
    線を選んだ:
        図: { 線を選んでいる: true }
        作業中の:
            ノード: { opacity: 0.35, 薄く表示: false, 強調から外れた: true }
            code: { 地の不透明さ: 0.3 }
            pre の中の code: { 地の不透明さ: 0.3 }
            mark: { 地の不透明さ: 1 }
        完了の:
            ノード: { opacity: 1, 薄く表示: true, 強調から外れた: false }
            code: { 地: 違う, 地の不透明さ: 0.3 }
            pre の中の code: { 地: 違う, 地の不透明さ: 0.3 }
            mark: { 地の不透明さ: 1 }
        外れて完了の:
            ノード: { opacity: 0.35, 薄く表示: true, 強調から外れた: true }
            code: { 地: 同じ, 地の不透明さ: 0.3 }
        受け取る:
            ノード: { opacity: 1, 強調から外れた: false }
            code: { 地: 同じ, 地の不透明さ: 0.3 }
    選びを解いた:
        図: { 線を選んでいる: false }
        作業中の:
            ノード: { opacity: 1, 強調から外れた: false }
            code: { 地の不透明さ: 0.9 }
            pre の中の code: { 地の不透明さ: 0.9 }
        完了の:
            code: { 地: 違う, 地の不透明さ: 0.9 }
            pre の中の code: { 地: 違う, 地の不透明さ: 0.9 }
        外れて完了の:
            ノード: { opacity: 1, 強調から外れた: false }
            code: { 地: 違う, 地の不透明さ: 0.9 }
        受け取る:
            code: { 地: 同じ, 地の不透明さ: 0.9 }
