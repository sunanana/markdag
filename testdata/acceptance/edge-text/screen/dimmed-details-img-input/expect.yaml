kind: 正常
checks: >-
    完了で薄く表示のノードでは、詳細に HTML で書いた画像 (img。data: の 1x1 の PNG) とチェックボックス (input) を要素ごと opacity 0.35 で薄くする。
    詳細はノードの中に開く (details.display: always)。1 行目の HTML は文字のまま (エスケープされる) なので、詳細の中に書く。
    作業中のノードでは 1。ポインタを載せると 1 に戻る
combos: [B チェックボックス 薄く表示, B 画像 薄く表示]
decisions: [F5-1]
render:
    api: >-
        render(element, input.md, { theme: 'dark', animate: false }) で描き、ノードの要素と部品の getComputedStyle を読む
    theme: dark
reference: 作業中の行
steps:
    - measure: 初め
    - hover: 完了の行
    - measure: 載せた
expect:
    diagnostics: []
    初め:
        作業中の行:
            詳細の画像: { opacity: 1 }
            詳細のチェックボックス: { opacity: 1 }
        完了の行:
            ノード: { opacity: 1, 薄く表示: true }
            詳細の画像: { opacity: 0.35 }
            詳細のチェックボックス: { opacity: 0.35 }
    載せた:
        完了の行:
            詳細の画像: { opacity: 1 }
            詳細のチェックボックス: { opacity: 1 }
