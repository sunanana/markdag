kind: 誤り
checks: >-
    本文の未定義の alias は icon-unknown (位置は :alias: 全体)。似た alias があれば「もしかして」。文字のまま残し、名前からは除く。図に出ない本文 (見出しの直下の引用ブロック) の印も数える
call:
    api: >-
        parseDocument → buildModel(nodes, frontmatter, source)
    icons: 渡さない
expect:
    diagnostics:
        - { code: icon-unknown, severity: warning, at: "9:11+9", hint_has: "「\\:nothere:」と書きます" }
        - { code: icon-unknown, severity: warning, at: "11:4+6", message_has: "「:typo:」は markdag.icons にない alias です" }
        - { code: icon-unknown, severity: warning, at: "12:7+8", hint_has: もしかして「:github:」 }
    nodes:
        - refText: Push
          marks: [typo]
          html_has: ":typo:"
        - refText: の打ち間違い
          marks: [githbu]
