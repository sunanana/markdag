kind: 誤り
checks: >-
    reject と同期の throw は、そのロゴを文字のままにして onDiagnostic に icon-unresolved (info、位置なし) を 1 件ずつ出す。render の diagnostics には入れない。ほかのロゴの問い合わせと描画は続く
call:
    api: >-
        render(container, input.md, { resolveIcon, onDiagnostic })
    resolver:
        "simple-icons:github": { reject: offline }
        ./logo.svg: { throw: boom }
        "simple-icons:kubernetes": { sync: ../../assets/triangle.svg }
expect:
    asked: ["simple-icons:github", ./logo.svg, "simple-icons:kubernetes"]
    after_settled:
        body_marks: { gh: ":gh:", logo: ":logo:", k8s: svg }
    diagnostics: []
    # 順は問わない
    onDiagnostic:
        - { code: icon-unresolved, severity: info, at: null, message_has: ["simple-icons:github", offline] }
        - { code: icon-unresolved, severity: info, at: null, message_has: [./logo.svg, boom] }
