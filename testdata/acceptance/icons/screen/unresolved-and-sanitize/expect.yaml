kind: 誤り
checks: >-
    引けないロゴ (null) と SVG として読めない文字列は文字のままで、onDiagnostic に icon-unresolved (warning、位置なし) を 1 件ずつ出す (render の diagnostics には入れない)。script、onload、title、XML 宣言を含む SVG は取り除いてから描く
render:
    options: { onDiagnostic }
    resolver:
        "simple-icons:github": null
        "simple-icons:broken": "not an svg"
        ./dirty.svg: ../../assets/dirty.svg
expect:
    diagnostics: []
    # 順は問わない
    onDiagnostic:
        - { code: icon-unresolved, severity: warning, at: null, message_has: ["simple-icons:github", "返さなかった (null)"] }
        - { code: icon-unresolved, severity: warning, at: null, message_has: ["simple-icons:broken", "SVG として読めなかった"] }
    body_marks:
        - { icon: gh, svg: false, text: ":gh:" }
        - { icon: broken, svg: false, text: ":broken:" }
        - { icon: dirty, svg: true, svg_html: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M0 0h24v24H0z"></path></svg>' }
